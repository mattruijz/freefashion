<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Free Fashion Plus">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none';">
  <title>Free Fashion Plus</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
  <style>
    :root {
      --orange: #FF751F;
      --ink: #000000;
      --paper: #ffffff;
      --muted: #6f6f6f;
      --key: #f3f3f3;
      --key-active: #e2e2e2;
      --gutter: clamp(24px, 5vw, 72px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Arimo', Arial, Helvetica, sans-serif;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

    #app { height: 100%; }
    .screen {
      height: 100%;
      padding: calc(var(--gutter) + env(safe-area-inset-top)) var(--gutter) calc(var(--gutter) + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .screen.enter { animation: fade .35s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* Logo */
    .logo { font-size: clamp(22px, 2.6vw, 32px); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
    .logo .plus { color: var(--orange); }
    .rule { height: 6px; background: var(--orange); width: 100%; max-width: 640px; }

    /* Start */
    .start { display: grid; grid-template-columns: 1fr minmax(320px, 420px); gap: var(--gutter); align-items: stretch; }
    .start-left { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .headline { font-weight: 400; font-size: clamp(40px, 6vw, 76px); line-height: 1.05; text-transform: uppercase; }
    .headline .here { color: var(--orange); }
    .prompt { font-size: clamp(16px, 1.8vw, 22px); color: var(--orange); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 18px; }
    .digits { display: flex; align-items: baseline; gap: 12px; }
    .digit {
      width: clamp(60px, 7vw, 88px); height: clamp(78px, 9vw, 112px);
      border-bottom: 6px solid var(--ink);
      font-size: clamp(48px, 6vw, 80px); font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .digit.next { border-color: var(--orange); }
    .digits .of { font-size: clamp(28px, 3.2vw, 44px); color: var(--muted); margin-left: 8px; }
    .digits.shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 12px; align-self: center; width: 100%; height: min(100%, 560px); }
    .key {
      background: var(--key); border-radius: 4px;
      font-size: clamp(30px, 3.4vw, 44px); font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      min-height: 64px;
    }
    .key:active { background: var(--key-active); }
    .key.go { background: var(--orange); color: var(--paper); font-size: clamp(18px, 1.8vw, 22px); letter-spacing: .06em; text-transform: uppercase; }
    .key.go:active { background: #e5641a; }
    .key.go:disabled { background: #ffc7a3; }
    .key.del { font-size: clamp(16px, 1.6vw, 20px); font-weight: 400; text-transform: uppercase; letter-spacing: .06em; }

    /* Welcome: same look as the back of the membercard */
    .welcome { background: var(--ink); color: var(--paper); justify-content: space-between; }
    .welcome .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
    .unlocked { font-size: clamp(44px, 7vw, 96px); line-height: 1.05; text-transform: uppercase; }
    .family { color: var(--orange); font-size: clamp(20px, 2.6vw, 34px); text-transform: uppercase; margin-top: 18px; letter-spacing: .02em; }
    .name { font-size: clamp(56px, 10vw, 140px); font-weight: 700; line-height: 1; text-transform: uppercase; margin-top: 10px; overflow-wrap: anywhere; }
    .enjoy { font-size: clamp(20px, 2.4vw, 30px); margin-top: 28px; }
    .countdown { height: 6px; background: var(--orange); width: 100%; max-width: 640px; transform-origin: left; }
    .welcome .logo { margin-top: 28px; }
    .notme {
      border: 2px solid var(--paper); color: var(--paper); border-radius: 4px;
      padding: 16px 22px; font-size: clamp(15px, 1.5vw, 18px); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    }
    .notme:active { background: rgba(255,255,255,.15); }

    /* Message screens (unknown / error / loading) */
    .message { justify-content: space-between; }
    .message h1 { font-weight: 400; font-size: clamp(40px, 6vw, 76px); line-height: 1.05; text-transform: uppercase; }
    .message h1 .accent { color: var(--orange); }
    .message p { font-size: clamp(20px, 2.4vw, 28px); margin-top: 24px; max-width: 760px; line-height: 1.35; }
    .btn {
      background: var(--orange); color: var(--paper); border-radius: 4px;
      padding: 22px 36px; font-size: clamp(18px, 1.8vw, 22px); text-transform: uppercase; letter-spacing: .06em; margin-top: 36px;
    }
    .btn:active { background: #e5641a; }
    .spinner { width: 64px; height: 64px; border: 6px solid var(--key); border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; margin-top: 36px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .demo-badge { position: fixed; right: 12px; bottom: 10px; font-size: 12px; color: var(--muted); }

    /* Portrait iPad / phones: stack keypad under the text */
    @media (orientation: portrait), (max-width: 760px) {
      .start { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .start-left { gap: 40px; justify-content: flex-start; }
      .keypad { height: 46vh; max-width: 560px; justify-self: center; }
      .start-left .rule { display: none; }
      .welcome .top { flex-direction: column-reverse; }
    }
    @media (max-width: 480px) {
      .digit { width: 52px; height: 68px; font-size: 42px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
  (function () {
    'use strict';

    // =========================================================
    //  CONFIG
    // =========================================================
    // Web-app URL van het Apps Script (zie kastvandestad-apps-script/SETUP.md).
    // Leeg laten = demo-modus met nepleden. Ook te forceren met ?demo in de URL.
    var SCRIPT_URL = '';
    var TOKEN = 'KVDS2026';

    var WELCOME_SECONDS = 10;   // welkomstscherm blijft zo lang staan
    var MESSAGE_SECONDS = 8;    // foutmeldingen blijven zo lang staan
    var IDLE_CLEAR_SECONDS = 30; // half ingetoetst nummer wordt na zo lang gewist
    var REQUEST_TIMEOUT_MS = 15000;

    var DEMO = !SCRIPT_URL || /[?&]demo\b/.test(location.search);
    var DEMO_MEMBERS = { '001': 'Alex', '002': 'Sam', '042': 'Noor', '095': '' };

    // =========================================================
    //  STATE
    // =========================================================
    var S = { screen: 'start', digits: '', result: null, timer: null, idleTimer: null };
    var loadedOn = new Date().toDateString();
    var lastScreen = null;

    // =========================================================
    //  DOM helpers (geen innerHTML)
    // =========================================================
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (k) {
          if (k === 'onclick') node.addEventListener('click', attrs[k]);
          else if (k === 'class') node.className = attrs[k];
          else if (k === 'style') node.setAttribute('style', attrs[k]);
          else if (k === 'disabled') { if (attrs[k]) node.disabled = true; }
          else node.setAttribute(k, attrs[k]);
        });
      }
      (children || []).forEach(function (c) {
        if (c == null) return;
        node.appendChild(typeof c === 'string' ? txt(c) : c);
      });
      return node;
    }
    function txt(str) { return document.createTextNode(str || ''); }

    function logo() {
      return el('div', { class: 'logo' }, ['Free Fashion ', el('span', { class: 'plus' }, ['Plus'])]);
    }

    // =========================================================
    //  SCREENS
    // =========================================================
    function renderStart() {
      var boxes = [];
      for (var i = 0; i < 3; i++) {
        boxes.push(el('div', { class: 'digit' + (i === S.digits.length ? ' next' : '') }, [S.digits[i] || '']));
      }

      var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(function (d) {
        return el('button', { class: 'key', onclick: function () { press(d); }, 'aria-label': d }, [d]);
      });
      keys.push(el('button', { class: 'key del', onclick: backspace, 'aria-label': 'Delete' }, ['Delete']));
      keys.push(el('button', { class: 'key', onclick: function () { press('0'); }, 'aria-label': '0' }, ['0']));
      keys.push(el('button', { class: 'key go', onclick: submit, disabled: !S.digits }, ['Unlock']));

      return el('div', { class: 'screen start' }, [
        el('div', { class: 'start-left' }, [
          logo(),
          el('div', null, [
            el('h1', { class: 'headline' }, ['Unlock your', el('br'), 'endless wardrobe ', el('span', { class: 'here' }, ['here'])]),
            el('div', { class: 'prompt' }, ['Enter your member No.']),
            el('div', { class: 'digits', id: 'digits' }, boxes.concat([el('span', { class: 'of' }, ['/100'])]))
          ]),
          el('div', { class: 'rule' })
        ]),
        el('div', { class: 'keypad' }, keys)
      ]);
    }

    function renderLoading() {
      return el('div', { class: 'screen message' }, [
        logo(),
        el('div', null, [
          el('h1', null, ['Unlocking', el('span', { class: 'accent' }, ['…'])]),
          el('div', { class: 'spinner' })
        ]),
        el('div', { class: 'rule' })
      ]);
    }

    function renderWelcome() {
      var r = S.result;
      return el('div', { class: 'screen welcome' }, [
        el('div', { class: 'top' }, [
          el('div', null, [
            el('div', { class: 'unlocked' }, ['Unlocked.']),
            el('div', { class: 'family' }, [r.name ? 'Welcome to the family,' : 'Welcome to the family!']),
            r.name ? el('div', { class: 'name' }, [r.name + '!']) : null,
            el('div', { class: 'enjoy' }, ['Enjoy your endless wardrobe.'])
          ]),
          el('button', { class: 'notme', onclick: notMe }, [r.name ? 'Not ' + r.name + '? Go back' : 'Not you? Go back'])
        ]),
        el('div', null, [
          el('div', { class: 'countdown', id: 'countdown' }),
          logo()
        ])
      ]);
    }

    function renderMessage(title, accent, body) {
      return el('div', { class: 'screen message' }, [
        logo(),
        el('div', null, [
          el('h1', null, [title, ' ', el('span', { class: 'accent' }, [accent])]),
          el('p', null, [body]),
          el('button', { class: 'btn', onclick: reset }, ['Try again'])
        ]),
        el('div', { class: 'rule' })
      ]);
    }

    function render() {
      var app = document.getElementById('app');
      var view;
      var nr = S.result && S.result.nr ? S.result.nr : S.digits;
      switch (S.screen) {
        case 'loading': view = renderLoading(); break;
        case 'welcome': view = renderWelcome(); break;
        case 'unknown': view = renderMessage('Hmm,', 'unknown number', 'We can’t find member No. ' + nr + '/100. Please check the number on the back of your card and try again.'); break;
        case 'inactive': view = renderMessage('Sorry,', 'card inactive', 'Member No. ' + nr + '/100 is not active right now. Please ask one of our team members.'); break;
        case 'error': view = renderMessage('Oops,', 'no connection', 'We couldn’t reach our member list. Please try again, or ask one of our team members to let you in.'); break;
        default: view = renderStart();
      }
      if (S.screen !== lastScreen) view.classList.add('enter');
      lastScreen = S.screen;
      app.replaceChildren(view);
      if (DEMO) app.appendChild(el('div', { class: 'demo-badge' }, ['Demo mode — try 001, 002, 042, 095']));
    }

    // =========================================================
    //  INPUT
    // =========================================================
    function press(d) {
      if (S.screen !== 'start' || S.digits.length >= 3) return;
      S.digits += d;
      armIdleClear();
      render();
    }
    function backspace() {
      if (S.screen !== 'start') return;
      S.digits = S.digits.slice(0, -1);
      armIdleClear();
      render();
    }
    function armIdleClear() {
      clearTimeout(S.idleTimer);
      S.idleTimer = setTimeout(function () {
        if (S.screen === 'start' && S.digits) { S.digits = ''; render(); }
      }, IDLE_CLEAR_SECONDS * 1000);
    }

    function submit() {
      if (S.screen !== 'start' || !S.digits) return;
      var n = parseInt(S.digits, 10);
      if (!n || n > 999) {
        var box = document.getElementById('digits');
        if (box) { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
        S.digits = '';
        setTimeout(render, 400);
        return;
      }
      var nr = ('000' + n).slice(-3);
      clearTimeout(S.idleTimer);
      S.screen = 'loading';
      render();

      call({ action: 'checkin', nr: nr }).then(function (res) {
        S.result = { nr: nr, name: res.name || '', id: res.id };
        if (res.status === 'ok') show('welcome', WELCOME_SECONDS);
        else if (res.status === 'inactive') show('inactive', MESSAGE_SECONDS);
        else if (res.status === 'unknown') show('unknown', MESSAGE_SECONDS);
        else throw new Error(res.message || 'Unexpected response');
      }).catch(function (err) {
        console.error(err);
        S.result = { nr: nr };
        show('error', MESSAGE_SECONDS);
      });
    }

    function notMe() {
      var id = S.result && S.result.id;
      if (id) call({ action: 'notme', id: id }).catch(function (err) { console.error(err); });
      reset();
    }

    function show(screen, seconds) {
      S.screen = screen;
      render();
      clearTimeout(S.timer);
      S.timer = setTimeout(reset, seconds * 1000);
      var bar = document.getElementById('countdown');
      if (bar && bar.animate) {
        bar.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: seconds * 1000, easing: 'linear', fill: 'forwards' });
      }
    }

    function reset() {
      clearTimeout(S.timer);
      S.screen = 'start';
      S.digits = '';
      S.result = null;
      // Na middernacht: herladen zodat een nieuwe versie van de pagina wordt opgepikt
      if (new Date().toDateString() !== loadedOn && navigator.onLine) { location.reload(); return; }
      render();
    }

    // =========================================================
    //  BACKEND (GET, zie CLAUDE.md)
    // =========================================================
    function call(params) {
      if (DEMO) return demoCall(params);
      params.token = TOKEN;
      var qs = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
      var ctrl = window.AbortController ? new AbortController() : null;
      var t = ctrl ? setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS) : null;
      return fetch(SCRIPT_URL + '?' + qs, { method: 'GET', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) {
          clearTimeout(t);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
    }

    function demoCall(params) {
      return new Promise(function (resolve) {
        setTimeout(function () {
          if (params.action === 'notme') return resolve({ status: 'ok' });
          if (params.nr === '999') return resolve({ status: 'inactive' });
          if (params.nr === '404') return resolve({ status: 'error', message: 'demo' });
          if (Object.prototype.hasOwnProperty.call(DEMO_MEMBERS, params.nr)) {
            return resolve({ status: 'ok', name: DEMO_MEMBERS[params.nr], id: 'demo' });
          }
          resolve({ status: 'unknown' });
        }, 700);
      });
    }

    // Houdt het Apps Script 'warm' zodat de eerste check-in niet traag is
    function keepWarm() {
      if (!DEMO && S.screen === 'start') fetch(SCRIPT_URL + '?action=ping').catch(function () {});
    }

    // =========================================================
    //  INIT
    // =========================================================
    document.addEventListener('keydown', function (e) {
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Enter') { if (S.screen === 'start') submit(); else if (S.screen !== 'loading') reset(); }
    });
    // Geen pinch-zoom of contextmenu op de kiosk
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    render();
    keepWarm();
    setInterval(keepWarm, 4 * 60 * 1000);
  })();
  </script>
</body>
</html>
