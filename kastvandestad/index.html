<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Free Fashion Plus">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none';">
  <title>Free Fashion Plus</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
  <style>
    :root {
      --orange: #FF751F;
      --ink: #000000;
      --paper: #ffffff;
      --muted: #8c8c8c;
      --key: #1c1c1c;
      --key-active: #333333;
      --gutter: clamp(24px, 5vw, 72px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Arimo', Arial, Helvetica, sans-serif;
      background: var(--ink);
      color: var(--paper);
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

    #app { height: 100%; }
    .screen {
      height: 100%;
      padding: calc(var(--gutter) + env(safe-area-inset-top)) var(--gutter) calc(var(--gutter) + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .screen.enter { animation: fade .35s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* Logo */
    .logo { font-size: clamp(22px, 2.6vw, 32px); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
    .logo .plus { color: var(--orange); }
    .rule { height: 6px; background: var(--orange); width: 100%; max-width: 640px; }

    /* Start */
    .start { display: grid; grid-template-columns: 1fr minmax(320px, 420px); gap: var(--gutter); align-items: stretch; }
    .start-left { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .headline { font-weight: 400; font-size: clamp(40px, 6vw, 76px); line-height: 1.05; text-transform: uppercase; }
    .headline .here { color: var(--orange); }
    .prompt { font-size: clamp(16px, 1.8vw, 22px); color: var(--orange); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 18px; }
    .digits { display: flex; align-items: baseline; gap: 12px; }
    .digit {
      width: clamp(60px, 7vw, 88px); height: clamp(78px, 9vw, 112px);
      border-bottom: 6px solid var(--paper);
      font-size: clamp(48px, 6vw, 80px); font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .digit.next { border-color: var(--orange); }
    .digits .of { font-size: clamp(28px, 3.2vw, 44px); color: var(--muted); margin-left: 8px; }
    .digits.shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 12px; align-self: center; width: 100%; height: min(100%, 560px); }
    .key {
      background: var(--key); border-radius: 4px;
      font-size: clamp(30px, 3.4vw, 44px); font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      min-height: 64px;
    }
    .key:active { background: var(--key-active); }
    .key.go { background: var(--orange); color: var(--paper); font-size: clamp(18px, 1.8vw, 22px); letter-spacing: .06em; text-transform: uppercase; }
    .key.go:active { background: #e5641a; }
    .key.go:disabled { background: #5c2f12; color: rgba(255,255,255,.55); }
    .key.del { font-size: clamp(16px, 1.6vw, 20px); font-weight: 400; text-transform: uppercase; letter-spacing: .06em; }

    /* Welcome: same look as the back of the membercard */
    .welcome { background: var(--ink); color: var(--paper); justify-content: space-between; }
    .family { color: var(--orange); font-size: clamp(44px, 7vw, 96px); line-height: 1.05; text-transform: uppercase; }
    .name { font-size: clamp(56px, 10vw, 140px); font-weight: 700; line-height: 1; text-transform: uppercase; margin-top: 18px; overflow-wrap: anywhere; }
    .enjoy { font-size: clamp(20px, 2.4vw, 30px); margin-top: 28px; }
    .countdown { height: 6px; background: var(--orange); width: 100%; max-width: 640px; transform-origin: left; }
    .welcome .logo { margin-top: 28px; }
    .notme {
      border: 2px solid var(--paper); color: var(--paper); border-radius: 4px;
      padding: 16px 22px; font-size: clamp(15px, 1.5vw, 18px); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
      margin-bottom: 24px;
    }
    .notme:active { background: rgba(255,255,255,.15); }

    /* Message screens (unknown / error / loading) */
    .message { justify-content: space-between; }
    .message h1 { font-weight: 400; font-size: clamp(40px, 6vw, 76px); line-height: 1.05; text-transform: uppercase; }
    .message h1 .accent { color: var(--orange); }
    .message p { font-size: clamp(20px, 2.4vw, 28px); margin-top: 24px; max-width: 760px; line-height: 1.35; }
    .btn {
      background: var(--orange); color: var(--paper); border-radius: 4px;
      padding: 22px 36px; font-size: clamp(18px, 1.8vw, 22px); text-transform: uppercase; letter-spacing: .06em; margin-top: 36px;
    }
    .btn:active { background: #e5641a; }
    .spinner { width: 64px; height: 64px; border: 6px solid var(--key); border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; margin-top: 36px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Lanceermodus ===== */
    .keyrow { display: flex; align-items: center; gap: 14px; margin-top: 28px; flex-wrap: wrap; }
    .keyslot {
      width: 44px; height: 44px; border-radius: 50%; border: 3px solid #444;
      display: flex; align-items: center; justify-content: center; color: transparent;
      transition: background .3s, border-color .3s;
    }
    .keyslot svg { width: 22px; height: 22px; }
    .keyslot.on { background: var(--orange); border-color: var(--orange); color: var(--paper); }
    .keylabel { font-size: clamp(14px, 1.5vw, 18px); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .keylabel strong { color: var(--paper); font-weight: 700; }

    .launch { justify-content: space-between; }
    .launch h1 { font-weight: 400; font-size: clamp(40px, 6vw, 76px); line-height: 1.05; text-transform: uppercase; }
    .launch h1 .accent { color: var(--orange); }
    .launch .sub { font-size: clamp(18px, 2.2vw, 26px); margin-top: 16px; color: var(--muted); }
    .holdrow { display: flex; justify-content: center; gap: clamp(28px, 7vw, 120px); flex-wrap: wrap; }
    .hold { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .ring {
      --p: 0;
      width: clamp(180px, 24vw, 280px); aspect-ratio: 1; border-radius: 50%;
      background: conic-gradient(var(--paper) calc(var(--p) * 1turn), #2a2a2a 0);
      display: flex; align-items: center; justify-content: center;
    }
    .holdbtn {
      width: calc(100% - 22px); height: calc(100% - 22px); border-radius: 50%;
      background: var(--orange); color: var(--paper);
      font-size: clamp(20px, 2.4vw, 30px); font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      touch-action: none; -webkit-user-select: none; user-select: none;
      transition: transform .15s, box-shadow .15s;
      padding: 0 12px; overflow-wrap: anywhere;
    }
    .holdbtn.held { transform: scale(.94); box-shadow: 0 0 60px rgba(255,117,31,.55); }
    .holdname { font-size: clamp(14px, 1.5vw, 18px); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .holdhint { text-align: center; font-size: clamp(18px, 2vw, 24px); min-height: 1.4em; }

    .count { align-items: center; justify-content: center; }
    .count .num { font-size: clamp(160px, 30vw, 360px); font-weight: 700; color: var(--orange); line-height: 1; animation: pop 1s ease-out; }
    @keyframes pop { 0% { transform: scale(1.6); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 85% { opacity: 1; } 100% { transform: scale(.85); opacity: 0; } }

    .reveal { justify-content: space-between; position: relative; overflow: hidden; }
    .reveal .unl { color: var(--orange); font-size: clamp(22px, 3vw, 40px); text-transform: uppercase; letter-spacing: .04em; }
    .reveal .big { font-size: clamp(56px, 9.5vw, 136px); font-weight: 700; line-height: .98; text-transform: uppercase; margin-top: 14px; }
    .reveal .big .plus { color: var(--orange); }
    .reveal .enjoy { margin-top: 30px; }
    .reveal .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
    .reveal .bottom .rule { flex: 1; min-width: 200px; }
    .reveal > * { position: relative; z-index: 1; animation: rise .9s ease-out both; }
    .reveal > *:nth-child(2) { animation-delay: .15s; }
    .reveal > *:nth-child(3) { animation-delay: .3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; animation: none !important; }
    .confetti i { position: absolute; top: -6vh; display: block; animation: fall linear forwards; }
    @keyframes fall { to { transform: translate(var(--dx), 115vh) rotate(var(--rot)); } }

    .demo-badge { position: fixed; right: 12px; bottom: 10px; font-size: 12px; color: var(--muted); }

    /* Portrait iPad / phones: stack keypad under the text */
    @media (orientation: portrait), (max-width: 760px) {
      .start { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .start-left { gap: 40px; justify-content: flex-start; }
      .keypad { height: 46vh; max-width: 560px; justify-self: center; }
      .start-left .rule { display: none; }
      .ring { width: clamp(200px, 36vw, 300px); }
    }
    @media (max-width: 480px) {
      .digit { width: 52px; height: 68px; font-size: 42px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
  (function () {
    'use strict';

    // =========================================================
    //  CONFIG
    // =========================================================
    // Web-app URL van het Apps Script (zie kastvandestad-apps-script/SETUP.md).
    // Leeg laten = demo-modus met nepleden. Ook te forceren met ?demo in de URL.
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytOeM09yVBGVRe4vlW2QBL33gy2szAUG5IF63gnai4H0vWOBKQj4btcrDjCSOGJHA/exec';
    var TOKEN = 'KVDS2026';

    var WELCOME_SECONDS = 10;   // welkomstscherm blijft zo lang staan
    var MESSAGE_SECONDS = 8;    // foutmeldingen blijven zo lang staan
    var IDLE_CLEAR_SECONDS = 30; // half ingetoetst nummer wordt na zo lang gewist
    var REQUEST_TIMEOUT_MS = 15000;

    var DEMO = !SCRIPT_URL || /[?&]demo\b/.test(location.search);
    var DEMO_MEMBERS = { '001': 'Alex', '002': 'Sam', '042': 'Noor', '095': '', '101': 'Robin', '102': 'Kim' };

    // Lanceermodus: aan met ?launch in de URL, of door 000 in te toetsen (nog eens 000 = uit).
    // Beide sleutelhouders loggen in, daarna houden ze samen de knoppen ingedrukt.
    var LAUNCH_KEYS = ['101', '102'];
    var LAUNCH_CODE = '000';
    var HOLD_SECONDS = 3;       // zo lang moeten beide knoppen tegelijk ingedrukt blijven
    var REVEAL_SECONDS = 180;   // daarna gaat het scherm vanzelf naar normaal inchecken

    // =========================================================
    //  STATE
    // =========================================================
    var S = { screen: 'start', digits: '', result: null, timer: null, idleTimer: null };
    var loadedOn = new Date().toDateString();
    var lastScreen = null;
    var L = { on: false, keys: {} };  // lanceerstatus; keys: { '101': 'Naam' }

    // =========================================================
    //  DOM helpers (geen innerHTML)
    // =========================================================
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (k) {
          if (k === 'onclick') node.addEventListener('click', attrs[k]);
          else if (k === 'class') node.className = attrs[k];
          else if (k === 'style') node.setAttribute('style', attrs[k]);
          else if (k === 'disabled') { if (attrs[k]) node.disabled = true; }
          else node.setAttribute(k, attrs[k]);
        });
      }
      (children || []).forEach(function (c) {
        if (c == null) return;
        node.appendChild(typeof c === 'string' ? txt(c) : c);
      });
      return node;
    }
    function txt(str) { return document.createTextNode(str || ''); }

    function logo() {
      return el('div', { class: 'logo' }, ['Free Fashion ', el('span', { class: 'plus' }, ['Plus'])]);
    }

    // =========================================================
    //  SCREENS
    // =========================================================
    function keyIcon() {
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2.4');
      svg.setAttribute('stroke-linecap', 'round');
      var c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', '8'); c.setAttribute('cy', '12'); c.setAttribute('r', '4');
      var path = document.createElementNS(ns, 'path');
      path.setAttribute('d', 'M12 12h9M18 12v3M21 12v2');
      svg.appendChild(c); svg.appendChild(path);
      return svg;
    }

    function keyRow() {
      var turned = turnedCount();
      var slots = LAUNCH_KEYS.map(function (nr) {
        return el('div', { class: 'keyslot' + (L.keys[nr] !== undefined ? ' on' : '') }, [keyIcon()]);
      });
      var label = turned === 0
        ? el('div', { class: 'keylabel' }, [LAUNCH_KEYS.length + ' keys needed to unlock'])
        : el('div', { class: 'keylabel' }, [el('strong', null, [turned + ' of ' + LAUNCH_KEYS.length]), ' keys turned']);
      return el('div', { class: 'keyrow' }, slots.concat([label]));
    }

    function renderStart() {
      var boxes = [];
      for (var i = 0; i < 3; i++) {
        boxes.push(el('div', { class: 'digit' + (i === S.digits.length ? ' next' : '') }, [S.digits[i] || '']));
      }

      var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(function (d) {
        return el('button', { class: 'key', onclick: function () { press(d); }, 'aria-label': d }, [d]);
      });
      keys.push(el('button', { class: 'key del', onclick: backspace, 'aria-label': 'Delete' }, ['Delete']));
      keys.push(el('button', { class: 'key', onclick: function () { press('0'); }, 'aria-label': '0' }, ['0']));
      keys.push(el('button', { class: 'key go', onclick: submit, disabled: !S.digits }, ['Unlock']));

      return el('div', { class: 'screen start' }, [
        el('div', { class: 'start-left' }, [
          logo(),
          el('div', null, [
            el('h1', { class: 'headline' }, ['Unlock your', el('br'), 'endless wardrobe ', el('span', { class: 'here' }, ['here'])]),
            el('div', { class: 'prompt' }, ['Enter your member No.']),
            el('div', { class: 'digits', id: 'digits' }, boxes.concat([el('span', { class: 'of' }, ['/100'])])),
            L.on ? keyRow() : null
          ]),
          el('div', { class: 'rule' })
        ]),
        el('div', { class: 'keypad' }, keys)
      ]);
    }

    function renderLoading() {
      return el('div', { class: 'screen message' }, [
        logo(),
        el('div', null, [
          el('h1', null, ['Unlocking', el('span', { class: 'accent' }, ['…'])]),
          el('div', { class: 'spinner' })
        ]),
        el('div', { class: 'rule' })
      ]);
    }

    function renderWelcome() {
      var r = S.result;
      return el('div', { class: 'screen welcome' }, [
        el('div', null, [
          el('div', { class: 'family' }, [r.name ? 'Welcome to the family,' : 'Welcome to the family!']),
          r.name ? el('div', { class: 'name' }, [r.name + '!']) : null,
          el('div', { class: 'enjoy' }, ['Enjoy your endless wardrobe.']),
          r.key ? keyRow() : null,
          el('button', { class: 'btn', onclick: reset }, [r.key && allKeysTurned() ? 'Ready to launch \u2192' : 'Next check-in \u2192'])
        ]),
        el('div', null, [
          el('button', { class: 'notme', onclick: notMe }, [r.name ? 'Not ' + r.name + '? Go back' : 'Not you? Go back']),
          el('div', { class: 'countdown', id: 'countdown' }),
          logo()
        ])
      ]);
    }

    function renderMessage(title, accent, body) {
      return el('div', { class: 'screen message' }, [
        logo(),
        el('div', null, [
          el('h1', null, [title, ' ', el('span', { class: 'accent' }, [accent])]),
          el('p', null, [body]),
          el('button', { class: 'btn', onclick: reset }, ['Try again'])
        ]),
        el('div', { class: 'rule' })
      ]);
    }

    function renderLaunch() {
      var holds = LAUNCH_KEYS.map(function (nr, i) {
        var name = L.keys[nr] || ('Key ' + (i + 1));
        return el('div', { class: 'hold' }, [
          el('div', { class: 'ring', id: 'ring' + i }, [
            el('button', { class: 'holdbtn', id: 'hold' + i, 'data-i': String(i) }, [name])
          ]),
          el('div', { class: 'holdname' }, ['Key ' + (i + 1)])
        ]);
      });
      return el('div', { class: 'screen launch' }, [
        logo(),
        el('div', null, [
          el('h1', null, ['Ready to ', el('span', { class: 'accent' }, ['unlock?'])]),
          el('div', { class: 'sub' }, ['Press and hold both buttons together'])
        ]),
        el('div', { class: 'holdrow' }, holds),
        el('div', { class: 'holdhint', id: 'holdhint' }),
        el('div', { class: 'rule' })
      ]);
    }

    function renderCount() {
      return el('div', { class: 'screen count' }, [el('div', { class: 'num' }, [String(S.count)])]);
    }

    function renderReveal() {
      return el('div', { class: 'screen reveal' }, [
        el('div', null, [
          el('div', { class: 'unl' }, ['Unlocked.']),
          el('div', { class: 'big' }, ['Free Fashion ', el('span', { class: 'plus' }, ['Plus']), el('br'), 'is live'])
        ]),
        el('div', { class: 'enjoy' }, ['Enjoy your endless wardrobe.']),
        el('div', { class: 'bottom' }, [
          el('div', { class: 'rule' }),
          el('button', { class: 'notme', onclick: reset }, ['Start check-ins \u2192'])
        ]),
        confetti()
      ]);
    }

    function confetti() {
      var colors = ['#FF751F', '#ffffff', '#FFB27F', '#FF751F'];
      var pieces = [];
      for (var i = 0; i < 140; i++) {
        var w = 6 + Math.random() * 10;
        pieces.push(el('i', { style:
          'left:' + (Math.random() * 100).toFixed(1) + '%;' +
          'width:' + w.toFixed(0) + 'px;height:' + (w * (0.4 + Math.random())).toFixed(0) + 'px;' +
          'background:' + colors[i % colors.length] + ';' +
          '--dx:' + ((Math.random() - 0.5) * 30).toFixed(0) + 'vw;' +
          '--rot:' + (360 + Math.random() * 1080).toFixed(0) + 'deg;' +
          'animation-duration:' + (3 + Math.random() * 4).toFixed(2) + 's;' +
          'animation-delay:' + (Math.random() * 2.5).toFixed(2) + 's;'
        }));
      }
      return el('div', { class: 'confetti', 'aria-hidden': 'true' }, pieces);
    }

    function render() {
      var app = document.getElementById('app');
      var view;
      var nr = S.result && S.result.nr ? S.result.nr : S.digits;
      switch (S.screen) {
        case 'loading': view = renderLoading(); break;
        case 'welcome': view = renderWelcome(); break;
        case 'launch': view = renderLaunch(); break;
        case 'count': view = renderCount(); break;
        case 'reveal': view = renderReveal(); break;
        case 'unknown': view = renderMessage('Hmm,', 'unknown number', 'We can’t find member No. ' + nr + '/100. Please check the number on the back of your card and try again.'); break;
        case 'inactive': view = renderMessage('Sorry,', 'card inactive', 'Member No. ' + nr + '/100 is not active right now. Please ask one of our team members.'); break;
        case 'error': view = renderMessage('Oops,', 'no connection', 'We couldn’t reach our member list. Please try again, or ask one of our team members to let you in.'); break;
        default: view = renderStart();
      }
      if (S.screen !== lastScreen || S.screen === 'count') view.classList.add('enter');
      lastScreen = S.screen;
      app.replaceChildren(view);
      if (DEMO) app.appendChild(el('div', { class: 'demo-badge' }, ['Demo mode — try 001, 002, 042, 095 · launch: 000, then 101 + 102']));
    }

    // =========================================================
    //  INPUT
    // =========================================================
    function press(d) {
      if (S.screen !== 'start' || S.digits.length >= 3) return;
      S.digits += d;
      armIdleClear();
      render();
    }
    function backspace() {
      if (S.screen !== 'start') return;
      S.digits = S.digits.slice(0, -1);
      armIdleClear();
      render();
    }
    function armIdleClear() {
      clearTimeout(S.idleTimer);
      S.idleTimer = setTimeout(function () {
        if (S.screen === 'start' && S.digits) { S.digits = ''; render(); }
      }, IDLE_CLEAR_SECONDS * 1000);
    }

    function submit() {
      if (S.screen !== 'start' || !S.digits) return;
      if (S.digits === LAUNCH_CODE) { toggleLaunch(); return; }
      var n = parseInt(S.digits, 10);
      if (!n || n > 999) {
        var box = document.getElementById('digits');
        if (box) { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
        S.digits = '';
        setTimeout(render, 400);
        return;
      }
      var nr = ('000' + n).slice(-3);
      clearTimeout(S.idleTimer);

      // Lancering: sleutelhouders werken altijd, ook zonder verbinding
      if (L.on && LAUNCH_KEYS.indexOf(nr) >= 0) {
        var keyName = members && members[nr] ? members[nr].name : '';
        S.result = { nr: nr, name: keyName, id: newId(), key: true };
        enqueue({ action: 'checkin', nr: nr, id: S.result.id, ts: Date.now(), kind: 'launch' });
        L.keys[nr] = keyName;
        saveLaunch();
        show('welcome', WELCOME_SECONDS);
        return;
      }

      // Snel pad: nummer staat in de lokale ledenlijst → meteen tonen,
      // de check-in gaat op de achtergrond naar het sheet.
      var m = members && members[nr];
      if (m) {
        S.result = { nr: nr, name: m.name, id: newId() };
        enqueue({ action: 'checkin', nr: nr, id: S.result.id, ts: Date.now() });
        if (m.active) show('welcome', WELCOME_SECONDS);
        else show('inactive', MESSAGE_SECONDS);
        return;
      }

      // Niet in de lokale lijst (of nog geen lijst): online navragen,
      // misschien is deze deelnemer net toegevoegd in het sheet.
      S.screen = 'loading';
      render();
      var id = newId();
      call({ action: 'checkin', nr: nr, id: id, ts: Date.now() }).then(function (res) {
        S.result = { nr: nr, name: res.name || '', id: res.id || id };
        if (res.status === 'ok') show('welcome', WELCOME_SECONDS);
        else if (res.status === 'inactive') show('inactive', MESSAGE_SECONDS);
        else if (res.status === 'unknown') show('unknown', MESSAGE_SECONDS);
        else throw new Error(res.message || 'Unexpected response');
        if (res.status !== 'unknown') refreshMembers().catch(function () {});
      }).catch(function (err) {
        console.error(err);
        S.result = { nr: nr };
        show('error', MESSAGE_SECONDS);
      });
    }

    function notMe() {
      var id = S.result && S.result.id;
      if (id) enqueue({ action: 'notme', id: id });
      if (S.result && S.result.key) { delete L.keys[S.result.nr]; saveLaunch(); }
      S.result = null;
      reset();
    }

    function newId() {
      return (Date.now().toString(36) + Math.random().toString(36).slice(2) + '000000').slice(-12);
    }

    function show(screen, seconds) {
      S.screen = screen;
      render();
      clearTimeout(S.timer);
      S.timer = setTimeout(reset, seconds * 1000);
      var bar = document.getElementById('countdown');
      if (bar && bar.animate) {
        bar.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: seconds * 1000, easing: 'linear', fill: 'forwards' });
      }
    }

    function reset() {
      clearTimeout(S.timer);
      S.screen = 'start';
      S.digits = '';
      S.result = null;
      if (L.on && allKeysTurned()) { S.screen = 'launch'; render(); startHold(); return; }
      // Na middernacht: herladen zodat een nieuwe versie van de pagina wordt opgepikt
      if (new Date().toDateString() !== loadedOn && navigator.onLine) { location.reload(); return; }
      render();
    }

    // =========================================================
    //  LANCERING
    // =========================================================
    var LAUNCH_KEY = 'kvds-launch';

    function turnedCount() {
      return LAUNCH_KEYS.filter(function (nr) { return L.keys[nr] !== undefined; }).length;
    }
    function allKeysTurned() { return turnedCount() === LAUNCH_KEYS.length; }

    // Bewaard met datum, zodat een herstart halverwege de ceremonie niets kwijtraakt
    function saveLaunch() {
      save(LAUNCH_KEY, { date: new Date().toDateString(), on: L.on, keys: L.keys, done: !!L.done });
    }

    function toggleLaunch() {
      L = { on: !L.on, keys: {}, done: false };
      saveLaunch();
      S.digits = '';
      render();
    }

    var hold = { held: [false, false], p: 0, raf: null, last: 0 };

    function startHold() {
      hold.held = LAUNCH_KEYS.map(function () { return false; });
      hold.p = 0;
      hold.last = 0;
      LAUNCH_KEYS.forEach(function (nr, i) {
        var btn = document.getElementById('hold' + i);
        var down = function (e) {
          e.preventDefault();
          ensureAudio();
          hold.held[i] = true;
          try { btn.setPointerCapture(e.pointerId); } catch (err) {}
          btn.classList.add('held');
        };
        var up = function () { hold.held[i] = false; btn.classList.remove('held'); };
        btn.addEventListener('pointerdown', down);
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('lostpointercapture', up);
      });
      cancelAnimationFrame(hold.raf);
      hold.raf = requestAnimationFrame(holdLoop);
    }

    function holdLoop(t) {
      if (S.screen !== 'launch') return;
      var dt = hold.last ? (t - hold.last) / 1000 : 0;
      hold.last = t;
      var count = hold.held.filter(Boolean).length;
      var all = count === hold.held.length;
      // Samen ingedrukt: ring loopt vol. Iemand laat los: ring loopt snel terug.
      hold.p = all ? Math.min(1, hold.p + dt / HOLD_SECONDS) : Math.max(0, hold.p - dt / 0.8);
      hold.held.forEach(function (h, i) {
        var ring = document.getElementById('ring' + i);
        if (ring) ring.style.setProperty('--p', hold.p.toFixed(3));
      });
      var hint = document.getElementById('holdhint');
      if (hint) {
        var waiting = LAUNCH_KEYS.filter(function (nr, i) { return !hold.held[i]; })
          .map(function (nr, i) { return L.keys[nr] || 'key ' + (LAUNCH_KEYS.indexOf(nr) + 1); });
        hint.textContent = all ? 'Keep holding\u2026'
          : count > 0 ? 'Waiting for ' + waiting.join(' & ') + '\u2026' : '';
      }
      if (hold.p >= 1) { startCountdown(); return; }
      hold.raf = requestAnimationFrame(holdLoop);
    }

    function startCountdown() {
      S.count = 3;
      S.screen = 'count';
      render();
      beep(660, 0.18);
      var tickTimer = setInterval(function () {
        S.count -= 1;
        if (S.count > 0) { render(); beep(660, 0.18); return; }
        clearInterval(tickTimer);
        launched();
      }, 1000);
    }

    function launched() {
      L = { on: false, keys: {}, done: true };
      saveLaunch();
      enqueue({ action: 'launch', id: newId(), ts: Date.now() });
      // ?launch uit de adresbalk halen, zodat herladen gewoon het inlogscherm geeft
      if (/[?&]launch\b/.test(location.search) && history.replaceState) {
        history.replaceState(null, '', location.pathname + (DEMO ? '?demo' : ''));
      }
      show('reveal', REVEAL_SECONDS);
      fanfare();
    }

    // Geluid zonder bestanden: korte tonen via Web Audio (start pas na een aanraking)
    var audio = null;
    function ensureAudio() {
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === 'suspended') audio.resume();
      } catch (e) { audio = null; }
    }
    function beep(freq, dur, delay) {
      if (!audio) return;
      var t = audio.currentTime + (delay || 0);
      var o = audio.createOscillator();
      var g = audio.createGain();
      o.type = 'triangle';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function fanfare() {
      [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.5, i * 0.12); });
      beep(1047, 1.2, 0.6); beep(1319, 1.2, 0.6);
    }

    // =========================================================
    //  BACKEND (GET, zie CLAUDE.md)
    // =========================================================
    function call(params) {
      if (DEMO) return demoCall(params);
      params.token = TOKEN;
      var qs = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
      var ctrl = window.AbortController ? new AbortController() : null;
      var t = ctrl ? setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS) : null;
      return fetch(SCRIPT_URL + '?' + qs, { method: 'GET', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) {
          clearTimeout(t);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
    }

    // =========================================================
    //  LEDENLIJST — lokaal bewaard, zodat unlocken direct gaat
    // =========================================================
    var MEMBERS_KEY = 'kvds-members';
    var QUEUE_KEY = 'kvds-queue';
    var members = null; // { '001': { name: 'Marieke', active: true }, ... }

    // localStorage kan ontbreken of falen; de pagina werkt dan gewoon online
    function save(key, value) {
      if (DEMO) return;
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
    function restore(key) {
      if (DEMO) return null;
      try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
    }

    function setMembers(list) {
      var map = {};
      list.forEach(function (m) { map[m[0]] = { name: m[1] || '', active: !!m[2] }; });
      members = map;
    }

    function refreshMembers() {
      return call({ action: 'members' }).then(function (res) {
        if (res.status !== 'ok' || !res.members) throw new Error(res.message || 'No member list');
        setMembers(res.members);
        save(MEMBERS_KEY, res.members);
      });
    }

    // =========================================================
    //  WACHTRIJ — check-ins en "Not you?" gaan één voor één naar
    //  het sheet; bij geen verbinding wordt het later opnieuw geprobeerd.
    // =========================================================
    var queue = restore(QUEUE_KEY) || [];
    var flushing = false;
    var retryTimer = null;

    function enqueue(params) {
      queue.push(params);
      save(QUEUE_KEY, queue);
      flush();
    }

    function flush() {
      if (flushing || !queue.length) return;
      flushing = true;
      call(Object.assign({}, queue[0])).then(function (res) {
        if (res.status === 'error') console.error('Server refused', queue[0], res.message);
        queue.shift();
        save(QUEUE_KEY, queue);
        flushing = false;
        flush();
      }).catch(function (err) {
        console.error('Sending failed, retrying in 30 s', err);
        flushing = false;
        clearTimeout(retryTimer);
        retryTimer = setTimeout(flush, 30000);
      });
    }

    function demoCall(params) {
      return new Promise(function (resolve) {
        setTimeout(function () {
          if (params.action === 'members') {
            return resolve({ status: 'ok', members: Object.keys(DEMO_MEMBERS).map(function (k) {
              return [k, DEMO_MEMBERS[k], 1];
            }).concat([['999', 'Demo', 0]]) });
          }
          if (params.action === 'notme') return resolve({ status: 'ok' });
          if (params.nr === '999') return resolve({ status: 'inactive' });
          if (params.nr === '404') return resolve({ status: 'error', message: 'demo' });
          if (Object.prototype.hasOwnProperty.call(DEMO_MEMBERS, params.nr)) {
            return resolve({ status: 'ok', name: DEMO_MEMBERS[params.nr], id: params.id });
          }
          resolve({ status: 'unknown' });
        }, 700);
      });
    }


    // =========================================================
    //  INIT
    // =========================================================
    document.addEventListener('keydown', function (e) {
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Enter') {
        if (S.screen === 'start') submit();
        else if (['welcome', 'unknown', 'inactive', 'error', 'reveal'].indexOf(S.screen) >= 0) reset();
      }
    });
    // Geen pinch-zoom of contextmenu op de kiosk
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    var saved = restore(MEMBERS_KEY);
    if (saved) setMembers(saved);
    var savedLaunch = restore(LAUNCH_KEY);
    if (savedLaunch && savedLaunch.date === new Date().toDateString()) {
      L = { on: !!savedLaunch.on, keys: savedLaunch.keys || {}, done: !!savedLaunch.done };
    }
    if (/[?&]launch\b/.test(location.search) && !L.done) L.on = true;
    if (L.on && allKeysTurned()) { S.screen = 'launch'; render(); startHold(); }
    else render();
    // Ledenlijst alleen bij het laden ophalen (de pagina herlaadt elke nacht);
    // eventueel achtergebleven check-ins van vóór een herstart alsnog versturen.
    refreshMembers().catch(function (err) { console.error(err); });
    flush();
  })();
  </script>
</body>
</html>
